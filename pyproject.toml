[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifaith"
version = "0.1.0"
description = "Claim-level faithfulness verification for RAG answers, as a library and a service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
nli = ["torch>=2.2", "transformers>=4.40"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "ruff>=0.4"]
all = ["verifaith[nli,service]"]

[tool.hatch.build.targets.wheel]
packages = ["src/verifaith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/Security() defaults
